<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#09243c" />
    <title>PlantãoPro — Sem conexão</title>
    <style>
        body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #0b2a52; color: #f5f8ff; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
        .card { text-align: center; padding: 48px 40px; max-width: 420px; }
        .icon { font-size: 56px; line-height: 1; margin-bottom: 20px; }
        h1 { font-size: 22px; margin: 0 0 12px; }
        p { font-size: 15px; color: #c7d6ef; margin: 0 0 28px; }
        .btn { display: inline-block; background: #155eef; color: #ffffff; text-decoration: none; border-radius: 10px; padding: 12px 28px; font-weight: 600; font-size: 15px; }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon" aria-hidden="true">&#128268;</div>
        <h1>Você está sem conexão</h1>
        <p>O PlantãoPro não conseguiu falar com o servidor. Verifique a rede e tente novamente; as telas já abertas continuam funcionando.</p>
        <a class="btn" href="/">Tentar novamente</a>
    </div>
</body>
</html>
